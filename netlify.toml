# ─────────────────────────────────────────────────────────────────────────
# Build
# ─────────────────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

# ─────────────────────────────────────────────────────────────────────────
# API: funções Netlify expostas em caminho limpo.
# IMPORTANTE: precisa vir ANTES do fallback SPA (redirects são avaliados
# na ordem; /* engoliria /api/*).
# ─────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ─────────────────────────────────────────────────────────────────────────
# SPA fallback: rotas do painel (/admin/*) servem o index.html.
# Status 200 = rewrite interno (não redireciona a URL no navegador).
# ─────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────
# Headers de segurança básicos (CSP fica no backlog — exige calibragem
# com fonts/SDKs do Google).
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# ─────────────────────────────────────────────────────────────────────────
# Build
# ─────────────────────────────────────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

# ─────────────────────────────────────────────────────────────────────────
# API: funções Netlify expostas em caminho limpo.
# IMPORTANTE: precisa vir ANTES do fallback SPA (redirects são avaliados
# na ordem; /* engoliria /api/*).
# ─────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ─────────────────────────────────────────────────────────────────────────
# SPA fallback: rotas do painel (/admin/*) servem o index.html.
# Status 200 = rewrite interno (não redireciona a URL no navegador).
# ─────────────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────
# Headers de segurança básicos
# ─────────────────────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP em Report-Only para coleta de violações (sem bloquear).
    # report-uri aponta para Netlify Function /api/csp-report
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' https://www.gstatic.com https://www.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: https://res.cloudinary.com https://i.ibb.co; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://firestore.googleapis.com https://api.cloudinary.com wss://*.firebaseio.com; form-action 'self' https://wa.me; base-uri 'self'; report-uri /api/csp-report;"
